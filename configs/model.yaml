# Model Configuration
model:
  name: DynamicDirectedSTGNN
  type: gcn_gru                     # Phase 1 baseline; switch to gat_gru later

  # GCN settings
  gcn:
    in_channels: 11                 # number of node features (see features below)
    hidden_channels: 64
    num_layers: 2
    dropout: 0.3
    normalize: true

  # GRU settings
  gru:
    hidden_size: 128
    num_layers: 2
    dropout: 0.3
    bidirectional: false

  # Output head
  output:
    targets: [sri_3, sri_6, sri_12]  # multi-scale SRI prediction
    out_dim: 3

  # Node features (F = 11)
  node_features:
    - rainfall
    - runoff
    - soil_moisture
    - evapotranspiration
    - groundwater
    - streamflow
    - temperature
    - reservoir_release
    - enso
    - spi
    - sri

  # Static node features appended to dynamic
  static_node_features:
    - elevation
    - area
    - slope
    - drainage_density
