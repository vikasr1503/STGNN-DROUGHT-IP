# Training Configuration
training:
  lookback: 12                      # months of past data used as input
  horizon: 1                        # months ahead to predict
  batch_size: 16
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: cosine_annealing
  patience: 15                      # early stopping patience

  # Train/Val/Test split by time
  split:
    train_end: "2015-12"
    val_end:   "2019-12"
    test_start: "2020-01"

  # Study period
  period:
    start: "1970-01"
    end:   "2025-12"

  device: cuda                      # use 'cpu' if no GPU

  # Checkpointing
  save_dir: models/checkpoints/
  log_dir:  outputs/logs/

  # Reproducibility
  seed: 42

# Drought index scales to compute
drought_indices:
  spi:  [1, 3, 6, 12]
  ssi:  [1, 3, 6, 12]
  sri:  [1, 3, 6, 12]
  gwi:  [3, 6, 12]
