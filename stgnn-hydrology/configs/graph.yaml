# Graph Construction Configuration
graph:
  node_type: subbasin               # nodes are SWAT sub-basins
  n_nodes: 130                      # Krishna River Basin: 130 sub-basins
  edge_type: river_connectivity     # directed upstream→downstream edges
  crs: EPSG:32644                   # WGS84 / UTM zone 44N

  # Static edge attributes
  static_edge_attrs:
    - elevation_difference
    - river_order
    - flow_accumulation
    - river_length
    - travel_distance

  # Dynamic edge weight formula components
  dynamic_edge_weight:
    variables: [runoff, flow_accumulation, spi, reservoir_release, travel_time]
    method: weighted_combination     # W(A,B,t) = f(Runoff, FlowAcc, Season, ResRelease, SPI, TravelTime)
    seasonal: true

  # Static node attributes
  static_node_attrs:
    - elevation
    - area
    - slope
    - drainage_density
